name: "Terraform CI/CD Pipeline"

on:
  push:
    branches:
      - main
      - develop
      - feature/**
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Type GO to confirm execution"
        required: true
        default: "GO"
      confirm_destroy:
        description: "Type DO to remove the development environment"
        required: true
        default: "NO"

permissions:
  id-token: write
  contents: read

jobs:
  setup:
    name: "Create storage"
    runs-on: ubuntu-latest
    # Only run setup when a feature/* is run
    if: >-
      ${{ github.event_name != 'workflow_dispatch' ||
          github.event.inputs.confirm_deploy != 'GO' }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Azure Login Auth
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          tenant-id: ${{ secrets.TENANT_ID }}
          subscription-id: ${{ secrets.SUBSCRIPTION_ID }}

      - run: |
          chmod +x ./scripts/createBlobStorage.sh
          ./scripts/createBlobStorage.sh
        env:
          GITHUB_ACTIONS_CLIENT_ID: ${{ secrets.CLIENT_ID }}
          GITHUB_ACTIONS_SP_OBJECT_ID: ${{ secrets.OBJECT_ID }}
        shell: bash

#     - name: Create blob storage using service principal to authenticate
#       run: |
#         # Explicit non-interactive service principal login
#         az login --service-principal \
#           -u "${{ secrets.CLIENT_ID }}" \
#           -p "${{ secrets.AZURE_CLIENT_SECRET }}" \
#           --tenant "${{ secrets.TENANT_ID }}"
#
#         chmod +x ./scripts/createBlobStorage.sh
#         ./scripts/createBlobStorage.sh
#       shell: bash

  plan:
    name: "Terraform init & Plan"
    runs-on: ubuntu-latest
    needs: setup
    # Only run setup when a feature/* is run
    if: >-
      ${{ github.event_name != 'workflow_dispatch' ||
          github.event.inputs.confirm_deploy != 'GO' }}

    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.SUBSCRIPTION_ID }}
    
    # Force the execution to run directly inside your dev folder
    defaults:
      run:
        working-directory: ./environments/dev

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Azure Login Auth
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          tenant-id: ${{ secrets.TENANT_ID }}
          subscription-id: ${{ secrets.SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: >-
          terraform init -input=false
          -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}"
          -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}"
          -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}"
          -backend-config="key=dev.terraform.tfstate"
          -backend-config="use_azuread_auth=true"
          -backend-config="use_oidc=true"

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-dev-plan
          path: environments/dev/tfplan
          if-no-files-found: error

  apply:
    name: "Terraform Apply"
    needs: plan
    runs-on: ubuntu-latest
    # Only run when this is manual and confirm_deploy == 'GO'
    if: >-
      ${{ 
         (github.event_name == 'workflow_dispatch' &&
          github.event.inputs.confirm_deploy == 'GO')
      }}

    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.SUBSCRIPTION_ID }}

    # Force the execution to run directly inside your dev folder
    defaults:
      run:
        working-directory: ./environments/dev

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Azure Login Auth
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          tenant-id: ${{ secrets.TENANT_ID }}
          subscription-id: ${{ secrets.SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: >-
          terraform init -input=false
          -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}"
          -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}"
          -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}"
          -backend-config="key=dev.terraform.tfstate"
          -backend-config="use_azuread_auth=true"
          -backend-config="use_oidc=true"

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-dev-plan
          path: environments/dev

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false tfplan

  destroy:
    name: "Terraform Destroy"
    needs: plan
    runs-on: ubuntu-latest
    # Only run when this is manual and confirm_destroy == 'DO'
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.event.inputs.confirm_destroy == 'DO' }}

    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.SUBSCRIPTION_ID }}

    defaults:
      run:
        working-directory: ./environments/dev

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Azure Login Auth
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          tenant-id: ${{ secrets.TENANT_ID }}
          subscription-id: ${{ secrets.SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: >-
          terraform init -input=false
          -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}"
          -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}"
          -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}"
          -backend-config="key=dev.terraform.tfstate"
          -backend-config="use_azuread_auth=true"
          -backend-config="use_oidc=true"

      - name: Terraform Destroy
        run: terraform destroy -auto-approve -input=false

      - name: Destroy storage
        run: az storage account delete --name aksterraformstorage --resource-group tfstate-rg --yes
