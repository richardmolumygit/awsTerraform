name: Branch-Driven EKS Lifecycle with Manual Review

on:
  push:
    branches:
      - 'feature/**'    # Triggers dev plan/apply
      - develop        # Triggers qa plan/gated apply
      - main           # Triggers prod plan/gated apply
  workflow_dispatch:
    inputs:
#
#     GitHub does not allow changing the default branch in the 
#       "Use workflow from" dropdown via workflow YAML configuration
#
#     branch:
#       description: Branch to  use
#       required: true
#       type: choice
#       default: feature/dev-only
#       options:
#         - feature/dev-only
#         - develop
#         - main
      environment:
        description: Environment to target
        required: true
        type: choice
        default: dev
        options:
          - dev
          - qa
          - prod
      confirm_deploy:
        description: "Choose plan to request apply after reviewing the plan"
        required: true
        type: choice
        default: None
        options:
          - plan
          - None
      confirm_destroy:
        description: "Choose destroy to remove the development environment"
        required: true
        type: choice
        default: None
        options:
          - None
          - destroy

# pull_request:
#   types: [closed]
#   branches:
#     - 'feature/**'    # Triggers dev destroy upon PR merge

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  s3-buckets:
    runs-on: ubuntu-latest
    env:
      BUCKET_NAME: ${{ vars.BUCKET_NAME }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ vars.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Show S3 buckets before creation
        run: |
          echo "=== Fetching S3 Buckets for region: $AWS_REGION ==="
          aws s3 ls --region "$AWS_REGION"

      - name: Show selected environment
        if: github.event_name == 'workflow_dispatch'
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          echo "Selected environment: $TARGET_ENVIRONMENT"

      - name: Ensure S3 Bucket Exists
        run: |
          if aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null; then
            echo "State bucket '$BUCKET_NAME' already exists."
          else
            echo "Creating S3 state bucket: $BUCKET_NAME..."
            create_args=(--bucket "$BUCKET_NAME" --region "$AWS_REGION")
            if [[ "$AWS_REGION" != "us-east-1" ]]; then
              create_args+=(--create-bucket-configuration "LocationConstraint=$AWS_REGION")
            fi
            aws s3api create-bucket "${create_args[@]}"
            aws s3api put-bucket-versioning --bucket "$BUCKET_NAME" \
              --versioning-configuration Status=Enabled
            echo "S3 bucket created and configured."
          fi
        shell: bash

      - name: Show S3 buckets after creation
        run: |
          echo "=== Fetching S3 Buckets for region: $AWS_REGION ==="
          aws s3 ls --region "$AWS_REGION"


  plan:
    name: "Terraform init & Plan"
    runs-on: ubuntu-latest
    needs: s3-buckets
    env:
      TF_ENVIRONMENT: >-
        ${{ inputs.environment ||
            (github.ref_name == 'main' && 'prod') ||
            (github.ref_name == 'develop' && 'qa') ||
            'dev' }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ vars.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.IMAGE_AWS_REGION }}

      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.BUCKET_NAME }}" \
            -backend-config="key=${TF_ENVIRONMENT}.terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="encrypt=true"

      - name: Terraform Plan
        run: |
          terraform plan -input=false -out=tfplan \
          -var="environment=$TF_ENVIRONMENT" \
          -var="aws_region=${{ vars.IMAGE_AWS_REGION }}"

      - name: Render Terraform Plan
        run: |
          terraform show -no-color tfplan > tfplan.txt
          cat tfplan.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ env.TF_ENVIRONMENT }}
          path: |
            tfplan
            tfplan.txt
          if-no-files-found: error

  apply:
    name: "Terraform Apply"
    needs: plan
    runs-on: ubuntu-latest
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          inputs.confirm_deploy == 'plan' &&
          inputs.confirm_destroy != 'destroy' }}
    environment:
      name: ${{ inputs.environment }}
    env:
      TF_ENVIRONMENT: ${{ inputs.environment }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ vars.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.IMAGE_AWS_REGION }}

      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.BUCKET_NAME }}" \
            -backend-config="key=${TF_ENVIRONMENT}.terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="encrypt=true"

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ env.TF_ENVIRONMENT }}
          path: .

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false tfplan

  destroy:
    name: "Terraform Destroy"
    needs: plan
    runs-on: ubuntu-latest
    # Only run when this is manual and confirm_destroy == 'destroy'
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.event.inputs.confirm_destroy == 'destroy' &&
          inputs.confirm_deploy != 'plan' }}
    environment:
      name: ${{ inputs.environment }}
    env:
      TF_ENVIRONMENT: ${{ inputs.environment }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ vars.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.IMAGE_AWS_REGION }}

      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.BUCKET_NAME }}" \
            -backend-config="key=${TF_ENVIRONMENT}.terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="encrypt=true"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Remove workload namespace before cluster teardown
        shell: bash
        run: |
          set -euo pipefail
          cluster_name="${TF_ENVIRONMENT}-eks-cluster"

          if ! aws eks describe-cluster \
            --name "$cluster_name" \
            --region "${{ vars.IMAGE_AWS_REGION }}" >/dev/null 2>&1; then
            echo "Cluster '$cluster_name' is already absent; skipping namespace cleanup."
            exit 0
          fi

          aws eks update-kubeconfig \
            --name "$cluster_name" \
            --region "${{ vars.IMAGE_AWS_REGION }}"
          kubectl delete namespace "$TF_ENVIRONMENT" \
            --ignore-not-found=true \
            --wait=true \
            --timeout=10m

      - name: Terraform Destroy
        run: |
          terraform destroy -auto-approve -input=false \
          -var="environment=$TF_ENVIRONMENT" \
          -var="aws_region=${{ vars.IMAGE_AWS_REGION }}"
