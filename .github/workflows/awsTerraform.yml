name: Branch-Driven EKS Lifecycle with Manual Review

on:
  push:
    branches:
      - 'feature/**'    # Triggers dev plan/apply
      - develop        # Triggers qa plan/gated apply
      - main           # Triggers prod plan/gated apply
# pull_request:
#   types: [closed]
#   branches:
#     - 'feature/**'    # Triggers dev destroy upon PR merge

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: "us-east-1"

jobs:
  set-vars:
    runs-on: ubuntu-latest
    steps:
      - name: Grab today's date and save it
        id: s3-vars
        run: |
          # Format the date (e.g., 20261007)
          CURRENT_DATE=$(date +'%Y%m%d')
          TODAYS_NAME="${{ vars.BUCKET_NAME }}-$CURRENT_DATE"
          echo "CURRENT_DATE [$CURRENT_DATE]"
          echo "AWS_REGION [${{ vars.AWS_REGION }}]"
          echo "BUCKET_NAME [${{ vars.BUCKET_NAME }}]"
          echo "TODAYS_NAME [$TODAYS_NAME]"
          echo "TODAYS_BUCKET_NAME=$TODAYS_NAME" >> "$GITHUB_OUTPUT"
          echo "AWS_REGION=${{ vars.AWS_REGION }}" >> "$GITHUB_OUTPUT"

  s3-list-buckets:
    runs-on: ubuntu-latest
    needs: set-vars
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ vars.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Show existing buckets
        run: aws s3 ls --region "$AWS_REGION"

  create-bucket:
    runs-on: ubuntu-latest
    needs: s3-list-buckets
      env_name: ${{ steps.s3-vars.outputs.env_name }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ vars.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Create S3 Bucket
        id: s3-vars
        run: |
          chmod +x ./scripts/createS3Bucket.sh
          ./scripts/createS3Bucket.sh
