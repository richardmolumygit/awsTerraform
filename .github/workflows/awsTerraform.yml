name: Branch-Driven EKS Lifecycle with Manual Review

on:
  push:
    branches:
      - 'feature/**'    # Triggers dev plan/apply
      - develop        # Triggers qa plan/gated apply
      - main           # Triggers prod plan/gated apply
# pull_request:
#   types: [closed]
#   branches:
#     - 'feature/**'    # Triggers dev destroy upon PR merge

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: "us-east-1"

jobs:
  set-vars:
    runs-on: ubuntu-latest
    outputs:
      bucket_name: ${{ steps.s3-vars.outputs.bucket_name }}
      aws_region: ${{ steps.s3-vars.outputs.aws_region }}
    steps:
      - name: Grab today's date and save it
        id: s3-vars
        run: |
          # Format the date (e.g., 20261007)
          CURRENT_TIME=$(date +'%H:%M:%S')
          CURRENT_DATE=$(date +'%Y%m%d')
          TODAYS_NAME="${{ vars.BUCKET_NAME }}-$CURRENT_DATE"
          echo "CURRENT_TIME [$CURRENT_TIME]"
          echo "CURRENT_DATE [$CURRENT_DATE]"
          echo "AWS_REGION [${{ vars.AWS_REGION }}]"
          echo "BUCKET_NAME [${{ vars.BUCKET_NAME }}]"
          echo "TODAYS_NAME [$TODAYS_NAME]"
          echo "bucket_name=$TODAYS_NAME" >> "$GITHUB_OUTPUT"
          echo "aws_region=${{ vars.AWS_REGION }}" >> "$GITHUB_OUTPUT"

  s3-buckets:
    runs-on: ubuntu-latest
    needs: set-vars
    env:
      BUCKET_NAME: ${{ needs.set-vars.outputs.bucket_name }}
      AWS_REGION: ${{ needs.set-vars.outputs.aws_region }}
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ vars.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ needs.set-vars.outputs.aws_region }}

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Show S3 buckets before creation
        run: |
          echo "=== Fetching S3 Buckets for region: $AWS_REGION ==="
          aws s3 ls --region "$AWS_REGION"

      - name: Create S3 Bucket
        id: s3-vars
        run: |
          chmod +x ./scripts/createS3Bucket.sh
          ./scripts/createS3Bucket.sh

      - name: Show S3 buckets after creation
        run: |
          echo "=== Fetching S3 Buckets for region: $AWS_REGION ==="
          aws s3 ls --region "$AWS_REGION"

